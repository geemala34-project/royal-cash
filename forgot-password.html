<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Royal Cash</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a1a;overflow:hidden;perspective:1200px}

  /* Animated background blobs */
  .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:float 8s ease-in-out infinite;z-index:0}
  .blob1{width:420px;height:420px;background:#7b2ff7;top:-110px;left:-110px}
  .blob2{width:360px;height:360px;background:#f107a3;bottom:-90px;right:-90px;animation-delay:-4s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,40px) scale(1.12)}}

  /* Floating particles */
  #particles{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .particle{position:absolute;bottom:-20px;border-radius:50%;background:radial-gradient(circle,#f0abfc,transparent 70%);opacity:0;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0) scale(1);opacity:0}10%{opacity:.8}85%{opacity:.4}100%{transform:translateY(-110vh) scale(.6);opacity:0}}

  /* 3D Card */
  .fp-card{position:relative;z-index:2;background:linear-gradient(#12122b,#12122b) padding-box,linear-gradient(135deg,#7b2ff7,#f107a3) border-box;border:2px solid transparent;border-radius:24px;padding:40px 32px;width:100%;max-width:400px;text-align:center;color:#fff;box-shadow:0 30px 80px rgba(123,47,247,.4);transform-style:preserve-3d;transition:transform .15s ease-out;animation:cardIn .6s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes cardIn{0%{transform:scale(.85) translateY(40px) rotateX(12deg);opacity:0}100%{transform:scale(1) translateY(0) rotateX(0);opacity:1}}
  .fp-card > *{transform:translateZ(30px)}

  /* Spinning ring around logo */
  .fp-logo-wrap{position:relative;width:96px;height:96px;margin:0 auto 14px}
  .fp-logo-wrap::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#7b2ff7,#f107a3,#c084fc,#7b2ff7);animation:spin 4s linear infinite}
  .fp-logo-wrap::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#12122b}
  .fp-logo{position:absolute;inset:14px;width:68px;height:68px;object-fit:contain;z-index:2}
  @keyframes spin{to{transform:rotate(360deg)}}

  .fp-card h1{font-size:28px;margin-bottom:8px}
  .fp-card h1 span{background:linear-gradient(135deg,#c084fc,#f107a3);-webkit-background-clip:text;background-clip:text;color:transparent}
  .fp-card p{color:#9aa0b4;font-size:14px;margin-bottom:24px;line-height:1.6}

  .fp-input{width:100%;padding:15px 18px;border-radius:14px;border:1.5px solid rgba(255,255,255,.15);background:#1a1a2e;color:#fff;font-size:15px;outline:none;margin-bottom:16px;transition:border-color .2s,box-shadow .2s,transform .2s}
  .fp-input:focus{border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,.25);transform:translateZ(15px)}
  .fp-input::placeholder{color:#6b7280}

  .fp-btn{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,#7b2ff7,#f107a3);color:#fff;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.5px;box-shadow:0 8px 24px rgba(241,7,163,.35);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
  .fp-btn:hover{transform:translateZ(20px) scale(1.02);box-shadow:0 14px 36px rgba(241,7,163,.55)}
  .fp-btn:active{transform:translateZ(5px) scale(.98)}
  .fp-btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out infinite}
  @keyframes shine{0%{left:-80%}60%,100%{left:130%}}

  .fp-msg{margin-top:16px;padding:12px 16px;border-radius:12px;font-size:14px;display:none}
  .fp-msg.show{display:block;animation:msgIn .3s ease-out}
  .fp-msg.success{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#86efac}
  .fp-msg.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;animation:msgIn .3s ease-out,shake .4s ease-out}
  @keyframes msgIn{0%{transform:translateY(-8px);opacity:0}100%{transform:translateY(0);opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .fp-back{display:inline-block;margin-top:20px;color:#c084fc;font-size:14px;text-decoration:none;font-weight:600}
  .fp-back:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="blob blob1" data-depth="50"></div>
<div class="blob blob2" data-depth="80"></div>
<div id="particles"></div>

<div class="fp-card" id="fpCard">
  <div class="fp-logo-wrap"><img src="royal-cash-logo.png" alt="Royal Cash" class="fp-logo"></div>
  <h1>Forgot <span>Password?</span></h1>
  <p>No worries! Enter your email and we'll send you a reset link.</p>

  <input type="email" id="email" class="fp-input" placeholder="Enter your email address">

  <button class="fp-btn" onclick="forgotPassword()">Send Reset Link</button>

  <div id="fpMessage" class="fp-msg"></div>

  <a href="mid-page.html" class="fp-back">← Back to Login</a>
</div>

<script>
/* 3D tilt + parallax */
const card = document.getElementById("fpCard");
document.addEventListener("mousemove", (e) => {
    const x = e.clientX / window.innerWidth - 0.5;
    const y = e.clientY / window.innerHeight - 0.5;
    card.style.transform = `rotateY(${x * 14}deg) rotateX(${-y * 14}deg)`;
    document.querySelectorAll(".blob").forEach(b => {
        const d = parseFloat(b.dataset.depth || 40);
        b.style.translate = `${-x * d}px ${-y * d}px`;
    });
});
document.addEventListener("mouseleave", () => {
    card.style.transform = "rotateY(0deg) rotateX(0deg)";
});

/* Floating particles */
(function(){
    const box = document.getElementById("particles");
    for(let i = 0; i < 28; i++){
        const p = document.createElement("span");
        p.className = "particle";
        const size = 4 + Math.random() * 10;
        p.style.width = size + "px";
        p.style.height = size + "px";
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDuration = (7 + Math.random() * 9) + "s";
        p.style.animationDelay = (Math.random() * 10) + "s";
        box.appendChild(p);
    }
})();

/* Forgot password */
async function forgotPassword(){
    const email = document.getElementById("email").value.trim();
    if(!email){ showMessage("Please enter your email address", "error"); return; }
    try{
        const response = await fetch(
        "https://royal-cash-backend-production-04cf.up.railway.app/auth/forgot-password",
        {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ email:email })
        });
        const data = await response.json();
        if(!response.ok){ showMessage(data.message || "Something went wrong", "error"); return; }
        showMessage(data.message || "Reset link sent! Check your inbox.", "success");
    }
    catch(err){
        showMessage("Server connection failed", "error");
    }
}

function showMessage(text, type){
    const msgBox = document.getElementById("fpMessage");
    msgBox.textContent = text;
    msgBox.className = "fp-msg show " + type;
}

document.getElementById("email").addEventListener("keydown", (e) => {
    if(e.key === "Enter") forgotPassword();
});
</script>

</body>
</html>
