<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Royal Cash Intro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="intro-screen" id="introScreen">

    <div class="bg-overlay"></div>
    <div class="bg-glow"></div>

    <span class="sparkle sp1"></span>
    <span class="sparkle sp2"></span>
    <span class="sparkle sp3"></span>
    <span class="sparkle sp4"></span>
    <span class="sparkle sp5"></span>
    <span class="sparkle sp6"></span>

    <div class="intro-content">

      <div class="logo-stage">
        <div class="orbit orbit-1"></div>
        <div class="orbit orbit-2"></div>
        <div class="logo-glow"></div>

        <img src="royal-cash-logo.png" alt="Royal Cash" class="royal-logo">

        <div class="logo-shadow"></div>
      </div>

      <div class="tagline">
        <span>PLAY</span>
        <span class="tag-icon">♛</span>
        <span>WIN</span>
        <span class="tag-icon">♛</span>
        <span>REPEAT</span>
      </div>

      <div class="mini-divider">
        <span></span>
        <i></i>
        <span></span>
      </div>

      <div class="loading-section">
        <div class="loading-bar">
          <div class="loading-progress" id="loadingProgress">
            <div class="bar-shine"></div>
          </div>
        </div>

        <div class="loading-info">
          <div class="loading-text">
            LOADING<span class="dots"></span>
          </div>
          <div class="loading-percent" id="loadingPercent">0%</div>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
