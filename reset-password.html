<!DOCTYPE html>
<html>
<head>
    <title>Reset Password - Royal Cash</title>

    <style>

        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f5f7fb;
            font-family:Arial;
        }


        .box{

            width:350px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);

        }


        h2{
            text-align:center;
            color:#1a73e8;
        }


        input{

            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ddd;
            border-radius:8px;

        }


        button{

            width:100%;
            padding:12px;
            background:#1a73e8;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;

        }


        button:hover{
            background:#1557b0;
        }


        #message{

            text-align:center;
            margin-top:15px;

        }

    </style>

</head>


<body>


<div class="box">

<h2>Reset Password</h2>


<input 
type="password"
id="password"
placeholder="New Password">


<input 
type="password"
id="confirmPassword"
placeholder="Confirm Password">


<button onclick="resetPassword()">
Reset Password
</button>


<p id="message"></p>


</div>



<script>


const params = new URLSearchParams(window.location.search);

const token = params.get("token");



async function resetPassword(){


const password =
document.getElementById("password").value;


const confirmPassword =
document.getElementById("confirmPassword").value;



if(password !== confirmPassword){

document.getElementById("message").innerHTML =
"Passwords do not match";

return;

}



const response =
await fetch(
"https://royal-cash-backend-production.up.railway.app/auth/reset-password",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},


body:JSON.stringify({

token:token,

newPassword:password

})


});



const data =
await response.json();



document.getElementById("message").innerHTML =
data.message;



}


</script>


</body>
</html>
