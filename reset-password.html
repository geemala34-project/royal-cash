<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Royal Cash</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a1a;overflow:hidden;perspective:1200px}

  /* Aurora background */
  .aurora{position:fixed;inset:0;z-index:0;overflow:hidden}
  .blob{position:absolute;filter:blur(100px);opacity:.55;animation:drift 12s ease-in-out infinite alternate}
  .b1{width:500px;height:500px;background:#7b2ff7;top:-120px;left:-120px;border-radius:50%}
  .b2{width:450px;height:450px;background:#f107a3;bottom:-100px;right:-100px;border-radius:50%;animation-delay:-4s}
  .b3{width:300px;height:300px;background:#4c1d95;top:40%;left:60%;border-radius:50%;animation-delay:-8s}
  @keyframes drift{0%{transform:translate(0,0) scale(1);border-radius:50%}50%{border-radius:40% 60% 55% 45%}100%{transform:translate(60px,-40px) scale(1.15);border-radius:60% 40% 45% 55%}}

  #particles{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .particle{position:absolute;bottom:-20px;border-radius:50%;background:radial-gradient(circle,#f0abfc,transparent 70%);opacity:0;animation:rise linear infinite}
  @keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.8}85%{opacity:.4}100%{transform:translateY(-110vh);opacity:0}}

  /* 3D Card */
  .rp-card{position:relative;z-index:2;background:linear-gradient(#12122b,#12122b) padding-box,linear-gradient(135deg,#7b2ff7,#f107a3) border-box;border:2px solid transparent;border-radius:24px;padding:40px 32px;width:100%;max-width:400px;text-align:center;color:#fff;box-shadow:0 30px 80px rgba(123,47,247,.4);transform-style:preserve-3d;transition:transform .15s ease-out;animation:cardIn .6s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes cardIn{0%{transform:scale(.85) translateY(40px) rotateX(12deg);opacity:0}100%{transform:scale(1) translateY(0) rotateX(0);opacity:1}}
  .rp-card > *{transform:translateZ(30px)}

  /* Spinning ring + lock */
  .rp-icon-wrap{position:relative;width:96px;height:96px;margin:0 auto 14px}
  .rp-icon-wrap::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(#7b2ff7,#f107a3,#c084fc,#7b2ff7);animation:spin 4s linear infinite}
  .rp-icon-wrap::after{content:"";position:absolute;inset:5px;border-radius:50%;background:#12122b}
  .rp-icon-wrap svg{position:absolute;inset:26px;width:44px;height:44px;z-index:2}
  @keyframes spin{to{transform:rotate(360deg)}}

  .rp-card h1{font-size:28px;margin-bottom:8px}
  .rp-card h1 span{background:linear-gradient(135deg,#c084fc,#f107a3);-webkit-background-clip:text;background-clip:text;color:transparent}
  .rp-card p{color:#9aa0b4;font-size:14px;margin-bottom:24px;line-height:1.6}

  .rp-field{position:relative;margin-bottom:14px}
  .rp-input{width:100%;padding:15px 48px 15px 18px;border-radius:14px;border:1.5px solid rgba(255,255,255,.15);background:#1a1a2e;color:#fff;font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s}
  .rp-input:focus{border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,.25)}
  .rp-input::placeholder{color:#6b7280}
  .eye-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:6px;opacity:.7}
  .eye-btn:hover{opacity:1}
  .match-icon{position:absolute;right:44px;top:50%;transform:translateY(-50%);font-size:18px;font-weight:700;display:none}
  .match-icon.ok{display:block;color:#4ade80}
  .match-icon.bad{display:block;color:#f87171}

  /* Strength meter */
  .strength{margin:-6px 0 16px;text-align:left}
  .strength-bar{height:6px;border-radius:6px;background:#1a1a2e;overflow:hidden;margin-bottom:6px}
  #strengthFill{height:100%;width:0%;border-radius:6px;transition:width .3s,background .3s;background:linear-gradient(90deg,#f107a3,#7b2ff7)}
  #strengthLabel{font-size:12px;color:#9aa0b4}

  .rp-btn{width:100%;padding:15px;border:none;border-radius:14px;background:linear-gradient(135deg,#7b2ff7,#f107a3);color:#fff;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:.5px;box-shadow:0 8px 24px rgba(241,7,163,.35);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
  .rp-btn:hover{transform:translateZ(20px) scale(1.02);box-shadow:0 14px 36px rgba(241,7,163,.55)}
  .rp-btn:active{transform:translateZ(5px) scale(.98)}
  .rp-btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3s ease-in-out infinite}
  @keyframes shine{0%{left:-80%}60%,100%{left:130%}}

  .rp-msg{margin-top:16px;padding:12px 16px;border-radius:12px;font-size:14px;display:none}
  .rp-msg.show{display:block;animation:msgIn .3s ease-out}
  .rp-msg.success{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.4);color:#86efac}
  .rp-msg.error{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;animation:msgIn .3s ease-out,shake .4s ease-out}
  @keyframes msgIn{0%{transform:translateY(-8px);opacity:0}100%{transform:translateY(0);opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  .rp-back{display:inline-block;margin-top:20px;color:#c084fc;font-size:14px;text-decoration:none;font-weight:600}
  .rp-back:hover{text-decoration:underline}

  /* Success checkmark */
  .check-svg{width:110px;height:110px;margin:0 auto 16px}
  .check-svg circle{fill:none;stroke:url(#checkGrad);stroke-width:3;stroke-dasharray:157;stroke-dashoffset:157;animation:draw .7s ease forwards}
  .check-svg path{fill:none;stroke:url(#checkGrad);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:48;stroke-dashoffset:48;animation:draw .45s .6s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  /* Confetti */
  .confetti{position:fixed;left:50%;top:38%;width:9px;height:9px;z-index:20;pointer-events:none;border-radius:2px;animation:boom 1.4s ease-out forwards}
  @keyframes boom{0%{transform:translate(0,0) rotate(0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) rotate(720deg) scale(.6);opacity:0}}
</style>
</head>
<body>

<div class="aurora">
  <div class="blob b1" data-depth="50"></div>
  <div class="blob b2" data-depth="80"></div>
  <div class="blob b3" data-depth="35"></div>
</div>
<div id="particles"></div>

<!-- RESET FORM -->
<div class="rp-card" id="rpCard">
  <div class="rp-icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round">
      <rect x="4" y="10" width="16" height="11" rx="2.5"/>
      <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
      <circle cx="12" cy="15.5" r="1.5" fill="#c084fc"/>
    </svg>
  </div>
  <h1>Create New <span>Password</span></h1>
  <p>Choose a strong password to keep your account safe.</p>

  <div class="rp-field">
    <input type="password" id="newPassword" class="rp-input" placeholder="New password">
    <button type="button" class="eye-btn" onclick="togglePw('newPassword')">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9aa0b4" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <div class="strength">
    <div class="strength-bar"><div id="strengthFill"></div></div>
    <span id="strengthLabel">Password strength</span>
  </div>

  <div class="rp-field">
    <input type="password" id="confirmPassword" class="rp-input" placeholder="Confirm new password" style="padding-right:70px">
    <span class="match-icon" id="matchIcon"></span>
    <button type="button" class="eye-btn" onclick="togglePw('confirmPassword')">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#9aa0b4" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <button class="rp-btn" onclick="resetPassword()">Reset Password</button>

  <div id="rpMessage" class="rp-msg"></div>

  <a href="mid-page.html" class="rp-back">← Back to Login</a>
</div>

<!-- SUCCESS -->
<div class="rp-card" id="successCard" style="display:none">
  <svg class="check-svg" viewBox="0 0 52 52">
    <defs><linearGradient id="checkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b2ff7"/><stop offset="1" stop-color="#f107a3"/>
    </linearGradient></defs>
    <circle cx="26" cy="26" r="24"/>
    <path d="M15 27l7.5 7.5L37 19"/>
  </svg>
  <h1>Password <span>Reset!</span></h1>
  <p>Your password has been changed successfully.<br>Redirecting to login in <b id="countdown" style="color:#fff">5</b>s...</p>
  <a href="mid-page.html" class="rp-back">Go to Login now →</a>
</div>

<script>
const API = "https://royal-cash-backend-production-04cf.up.railway.app";
const token = new URLSearchParams(window.location.search).get("token");

/* 3D tilt + parallax */
const card = document.getElementById("rpCard");
document.addEventListener("mousemove", (e) => {
    const x = e.clientX / window.innerWidth - 0.5;
    const y = e.clientY / window.innerHeight - 0.5;
    [card, document.getElementById("successCard")].forEach(c => {
        if(c) c.style.transform = `rotateY(${x * 14}deg) rotateX(${-y * 14}deg)`;
    });
    document.querySelectorAll(".blob").forEach(b => {
        const d = parseFloat(b.dataset.depth || 40);
        b.style.translate = `${-x * d}px ${-y * d}px`;
    });
});

/* Particles */
(function(){
    const box = document.getElementById("particles");
    for(let i = 0; i < 28; i++){
        const p = document.createElement("span");
        p.className = "particle";
        const size = 4 + Math.random() * 10;
        p.style.width = size + "px";
        p.style.height = size + "px";
        p.style.left = Math.random() * 100 + "%";
        p.style.animationDuration = (7 + Math.random() * 9) + "s";
        p.style.animationDelay = (Math.random() * 10) + "s";
        box.appendChild(p);
    }
})();

/* Show/hide password */
function togglePw(id){
    const input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}

/* Strength meter */
const pwInput = document.getElementById("newPassword");
const fill = document.getElementById("strengthFill");
const label = document.getElementById("strengthLabel");
pwInput.addEventListener("input", () => {
    const pw = pwInput.value;
    let score = 0;
    if(pw.length >= 8) score++;
    if(pw.length >= 12) score++;
    if(/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
    if(/\d/.test(pw)) score++;
    if(/[^A-Za-z0-9]/.test(pw)) score++;
    const levels = [
        {w:"0%", t:"Password strength", c:"#555"},
        {w:"20%", t:"Weak 😟", c:"#f87171"},
        {w:"40%", t:"Fair 🙂", c:"#fb923c"},
        {w:"60%", t:"Good 😊", c:"#facc15"},
        {w:"80%", t:"Strong 💪", c:"#4ade80"},
        {w:"100%", t:"Excellent! 🔥", c:"#4ade80"}
    ];
    const l = levels[score];
    fill.style.width = l.w;
    fill.style.background = l.c;
    label.textContent = l.t;
    label.style.color = l.c;
    checkMatch();
});

/* Match indicator */
const confirmInput = document.getElementById("confirmPassword");
const matchIcon = document.getElementById("matchIcon");
function checkMatch(){
    const a = pwInput.value, b = confirmInput.value;
    if(!b){ matchIcon.className = "match-icon"; return; }
    if(a === b){ matchIcon.textContent = "✓"; matchIcon.className = "match-icon ok"; }
    else { matchIcon.textContent = "✗"; matchIcon.className = "match-icon bad"; }
}
confirmInput.addEventListener("input", checkMatch);

/* Reset */
async function resetPassword(){
    const np = pwInput.value;
    const cp = confirmInput.value;

    if(!token){ showMessage("Invalid or expired reset link", "error"); return; }
    if(np.length < 6){ showMessage("Password must be at least 6 characters", "error"); return; }
    if(np !== cp){ showMessage("Passwords do not match", "error"); return; }

    try{
        const response = await fetch(API + "/auth/reset-password", {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ token: token, newPassword: np })
        });
        const data = await response.json();
        if(!response.ok){ showMessage(data.message || "Reset failed", "error"); return; }
        showSuccess();
    }
    catch(err){ showMessage("Server connection failed", "error"); }
}

function showMessage(text, type){
    const m = document.getElementById("rpMessage");
    m.textContent = text;
    m.className = "rp-msg show " + type;
}

/* Success: confetti + countdown redirect */
function showSuccess(){
    document.getElementById("rpCard").style.display = "none";
    const s = document.getElementById("successCard");
    s.style.display = "block";
    confettiBurst();
    let n = 5;
    const cd = document.getElementById("countdown");
    const iv = setInterval(() => {
        n--;
        if(cd) cd.textContent = n;
        if(n <= 0){ clearInterval(iv); window.location.href = "mid-page.html"; }
    }, 1000);
}

function confettiBurst(){
    const colors = ["#7b2ff7","#f107a3","#c084fc","#f0abfc","#ffffff"];
    for(let i = 0; i < 60; i++){
        const c = document.createElement("span");
        c.className = "confetti";
        c.style.background = colors[i % colors.length];
        const angle = Math.random() * Math.PI * 2;
        const dist = 130 + Math.random() * 200;
        c.style.setProperty("--tx", Math.cos(angle) * dist + "px");
        c.style.setProperty("--ty", Math.sin(angle) * dist + "px");
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 1500);
    }
}
</script>

</body>
</html>
